[project]
name = "kulturbytes-common"
version = "0.1.0"
description = "Gemeinsame Funktionen für die Kulturbytes-Publisher"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
