[project]
name = "kulturbytes-social"
version = "0.1.0"
description = "Kulturbytes-Veranstaltungen auf sozialen Plattformen veröffentlichen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "kulturbytes-bluesky",
    "kulturbytes-facebook",
    "kulturbytes-instagram",
    "kulturbytes-mastodon",
]

[project.scripts]
kulturbytes-social = "kulturbytes_social.cli:cli"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["common", "facebook", "mastodon", "instagram", "bluesky"]

[tool.uv.sources]
kulturbytes-facebook = { workspace = true }
kulturbytes-mastodon = { workspace = true }
kulturbytes-instagram = { workspace = true }
kulturbytes-bluesky = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "common/src", "facebook/src", "instagram/src", "mastodon/src", "bluesky/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
